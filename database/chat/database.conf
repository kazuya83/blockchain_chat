# 開発 Docker がこのパッケージ用に作る database 名。
# 初期化スクリプト（build/docker-entrypoint-initdb.d/）が読み、この名前で database を作って sql/ を流す。
#
# これは**ローカルの開発 Docker だけ**の名前で、リモート環境の database 名は環境ごとに別。
# 接続先は backend の `DB_DATABASE` が持つので、ここを変えてもリモート環境には影響しない。
# 変えたときは手元の `.env` も合わせること（食い違うと backend がつながらない）。
DATABASE_NAME="blockchain_chat_local"
